name: LodServerSupport
version: '${version}'
main: dev.vox.lss.paper.LSSPaperPlugin
api-version: '1.21.11'
# 1.21.11 support line (fresh v0.10.0 re-port): Folia publishes real MC 1.21.11 builds, so
# the flag is correct HERE for the same reason it is correct on the 26.2 primary line — the
# guarded failure is a jar that silently stops loading on Folia (PluginYmlContractTest +
# release_check.py pin its PRESENCE; the R-7 direction-flip check was applied, not assumed).
# Folia support remains EXPERIMENTAL on every line — single-player soak validated; concurrent
# multi-region ingress untested. Do NOT treat the flag's presence as a claim that
# SOAK_PLATFORM=folia has passed on 1.21.11.
folia-supported: true
# C5 (XVER §7): the Via mismatch guard reflectively reads ViaVersion's API when the
# plugin is present. softdepend keeps Spigot's classloader from logging the one-time
# "loaded class ... which is not a depend/softdepend" warning on the first handshake —
# noise that reads like an LSS bug. No hard dependency: without Via the probe is a
# silent no-signal.
softdepend: [ViaVersion]
description: Paper Plugin that provides unofficial multiplayer support for Voxy.
author: VoX
website: https://modrinth.com/plugin/lod-server-support
commands:
  lsslod:
    description: LOD Server Support admin commands
    usage: /lsslod <stats|diag|store>
    permission: lss.admin
permissions:
  lss.admin:
    description: Access to LSS admin commands
    default: op
