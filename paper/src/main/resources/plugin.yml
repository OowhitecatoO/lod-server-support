name: LodServerSupport
version: '${version}'
main: dev.vox.lss.paper.LSSPaperPlugin
api-version: '26.1.2'
# Folia publishes MC 26.1.2 builds, so this support line declares folia-supported (unlike the
# 26.2 primary line, where the flag is deliberately absent until Folia ships 26.2). Folia
# support stays EXPERIMENTAL: single-player soak validated, concurrent multi-region ingress
# untested (PluginYmlContractTest + release_check.py pin the flag's presence on this line).
folia-supported: true
description: Paper Plugin that provides unofficial multiplayer support for Voxy.
author: VoX
website: https://modrinth.com/plugin/lod-server-support
commands:
  lsslod:
    description: LOD Server Support admin commands
    usage: /lsslod <stats|diag>
    permission: lss.admin
permissions:
  lss.admin:
    description: Access to LSS admin commands
    default: op
